<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bitácora XPRO HUB</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#18334a;font:16px system-ui}header{background:#10243a;color:white;padding:24px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header b{color:#67dca0}main{max-width:1120px;margin:auto;padding:24px}section,article{background:white;border:1px solid #dce4eb;border-radius:14px;padding:20px;margin-bottom:16px}h1,h2,h3{margin:0 0 12px}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #c4d2df;border-radius:8px}input,textarea,select{width:100%;margin:5px 0 12px}textarea{min-height:80px}button{cursor:pointer;background:#176b51;color:white;border:0;font-weight:600}button.secondary{background:#344e67}button.danger{background:#a33d3d}nav,.actions,.stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.stats>div{background:white;border-radius:12px;padding:18px;flex:1;min-width:115px}.stats strong{display:block;font-size:28px}label{font-weight:600}small{color:#52667b}p{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#176b51;overflow-wrap:anywhere}img{max-width:100%;max-height:220px;border-radius:8px}progress{width:100%;accent-color:#176b51}#message{min-height:24px;color:#9b3232} [hidden]{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}article{margin:0}.muted{color:#52667b}#editor{border:2px solid #176b51} </style>
<header><div><h1>BITÁCORA <b>XPRO HUB</b></h1>Ideas · Proyectos · Acción</div><button id="logout" hidden>Cerrar sesión</button></header><main><p id="message" role="status"></p><section id="login"><h2>Acceso personal</h2><p>De una idea a una realidad.</p><form id="loginForm"><label>Correo<input type="email" id="email" required autocomplete="username"></label><label>Contraseña<input type="password" id="password" required autocomplete="current-password"></label><button>Ingresar</button></form></section><div id="app" hidden><div class="stats" id="stats"></div><nav id="nav"></nav><div class="actions"><button id="new">+ Nuevo registro</button><button id="backup" class="secondary">Exportar datos JSON</button></div><input id="search" placeholder="Buscar en tus ideas, proyectos y pendientes…"><section id="editor" hidden><h2 id="editorTitle">Nuevo registro</h2><form id="form"><label>Tipo<select name="kind"><option>Proyecto</option><option>Idea</option><option>Pendiente</option></select></label><label>Título<input name="title" required maxlength="200"></label><label>Descripción<textarea name="description"></textarea></label><label>Proyecto relacionado<select name="parent_id" id="parents"></select></label><label>Estado<select name="status"><option>Por iniciar</option><option>En desarrollo</option><option>En pausa</option><option>Finalizado</option></select></label><label>Prioridad<select name="priority"><option>Media</option><option>Alta</option><option>Baja</option></select></label><label>Avance (%)<input name="progress" type="number" min="0" max="100" value="0" required></label><label>Fecha límite<input name="due" type="date"></label><label>Último avance<textarea name="last_step"></textarea></label><label>Próxima acción<textarea name="next_step"></textarea></label><label>Enlaces (uno por línea)<textarea name="links" placeholder="https://..."></textarea></label><label>Agregar imagen privada (máx. 5 MB)<input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><div class="actions"><button id="save">Guardar</button><button type="button" class="secondary" id="cancel">Cancelar</button></div></form></section><h2 id="heading">¿Dónde me quedé?</h2><div id="cards" class="grid"></div></div></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL='https://gibgjphsxoyozlaagglt.supabase.co', KEY='sb_publishable_rYFJrkDFvZbssJ_onkGZnA_41vaRffR';
const $=id=>document.getElementById(id);const msg=t=>{$('message').textContent=t};let db,user,items=[],tab='Inicio',editing=null,epoch=0;const f=$('form');
function el(tag,text,cls){const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n}function btn(t,fn,cls){let b=el('button',t,cls);b.type='button';b.onclick=fn;return b}function add(p,...nodes){p.append(...nodes)}function safeLink(s){try{let u=new globalThis.URL(s);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}
function fail(e){msg(e?.message||String(e))}async function load(){const {data,error}=await db.from('entries').select('*').order('updated_at',{ascending:false});if(error)throw error;items=data;render()}
function render(){let stamp=++epoch;$('stats').replaceChildren();for(let [label,n] of [['Proyectos',items.filter(x=>x.kind==='Proyecto').length],['Ideas',items.filter(x=>x.kind==='Idea').length],['Pendientes',items.filter(x=>x.kind==='Pendiente'&&x.status!=='Finalizado').length],['Finalizados',items.filter(x=>x.status==='Finalizado').length]]){let d=el('div');add(d,el('strong',n),el('span',label));$('stats').append(d)}$('nav').replaceChildren(...['Inicio','Proyecto','Idea','Pendiente','Finalizado'].map(t=>btn(({Proyecto:'Proyectos',Idea:'Ideas',Pendiente:'Pendientes',Finalizado:'Finalizados'})[t]||t,()=>{tab=t;render()},t===tab?'':'secondary')));let q=$('search').value.toLowerCase();let list=items.filter(x=>(tab==='Inicio'||x.kind===tab||tab==='Finalizado'&&x.status===tab)&&JSON.stringify(x).toLowerCase().includes(q));$('heading').textContent=tab==='Inicio'?'¿Dónde me quedé?':tab;$('cards').replaceChildren();if(!list.length)$('cards').append(el('p','No hay registros todavía. Crea el primero.'));for(let x of list){let a=el('article');add(a,el('small',x.kind+' · '+x.status+' · Prioridad '+x.priority),el('h3',x.title),el('p',x.description));let pr=el('progress');pr.max=100;pr.value=x.progress;add(a,pr,el('small',x.progress+'% · Actualizado '+new Date(x.updated_at).toLocaleString('es-PE')));if(x.due)add(a,el('p','Fecha límite: '+x.due));let parent=items.find(i=>i.id===x.parent_id);if(parent)add(a,el('small','Proyecto: '+parent.title));add(a,el('p','Último avance: '+(x.last_step||'Sin registrar')),el('p','Próxima acción: '+(x.next_step||'Sin registrar')));for(let s of (x.links||'').split('\n')){let u=safeLink(s.trim());if(u){let link=el('a',s);link.href=u;link.target='_blank';link.rel='noopener noreferrer';add(a,link,el('div'))}}for(let path of x.images||[]){db.storage.from('private-images').createSignedUrl(path,300).then(({data})=>{if(data&&stamp===epoch){let im=el('img');im.src=data.signedUrl;im.alt='Imagen adjunta';a.append(im)}})}let actions=el('div',null,'actions');add(actions,btn('Editar',()=>edit(x)),btn('Finalizar',async()=>{try{let {error}=await db.from('entries').update({status:'Finalizado',progress:100}).eq('id',x.id);if(error)throw error;await load()}catch(e){fail(e)}},'secondary'),btn('Eliminar',async()=>{if(!confirm('¿Eliminar este registro?'))return;try{let {error}=await db.from('entries').delete().eq('id',x.id);if(error)throw error;if(x.images?.length){let r=await db.storage.from('private-images').remove(x.images);if(r.error)fail(r.error)}await load()}catch(e){fail(e)}},'danger'));add(a,actions);if(x.history?.length){let d=el('details');add(d,el('summary','Bitácora de avances'));for(let h of [...x.history].reverse())add(d,el('p',new Date(h.date).toLocaleString('es-PE')+' — '+h.text));a.append(d)}$('cards').append(a)}}
function edit(x){editing=x||null;f.reset();$('parents').replaceChildren(new Option('Sin proyecto',''),...items.filter(i=>i.kind==='Proyecto'&&i.id!==x?.id).map(i=>new Option(i.title,i.id)));if(x)for(let k of ['kind','title','description','parent_id','status','priority','progress','due','last_step','next_step','links'])f.elements[k].value=x[k]??'';else if(['Proyecto','Idea','Pendiente'].includes(tab))f.elements.kind.value=tab;$('editor').hidden=false;$('editorTitle').textContent=x?'Editar registro':'Nuevo registro';$('editor').scrollIntoView({behavior:'smooth'})}
$('new').onclick=()=>edit();$('cancel').onclick=()=>{$('editor').hidden=true};$('search').oninput=render;f.onsubmit=async e=>{e.preventDefault();$('save').disabled=true;let uploaded=null;try{let v=Object.fromEntries(new FormData(f));v.progress=Number(v.progress);v.due=v.due||null;v.parent_id=v.parent_id||null;v.owner=user.id;v.images=[...(editing?.images||[])];v.history=[...(editing?.history||[])];if(v.last_step&&v.last_step!==editing?.last_step)v.history.push({date:new Date().toISOString(),text:v.last_step});let file=$('image').files[0];if(file){if(file.size>5*1024*1024||!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type))throw Error('Imagen no válida o mayor a 5 MB');uploaded=user.id+'/'+crypto.randomUUID();let {error}=await db.storage.from('private-images').upload(uploaded,file,{contentType:file.type});if(error)throw error;v.images.push(uploaded)}let r=editing?await db.from('entries').update(v).eq('id',editing.id):await db.from('entries').insert(v);if(r.error)throw r.error;uploaded=null;$('editor').hidden=true;await load();msg('Registro guardado.')}catch(e){if(uploaded)await db.storage.from('private-images').remove([uploaded]);fail(e)}finally{$('save').disabled=false}};
$('backup').onclick=()=>{let url=globalThis.URL.createObjectURL(new Blob([JSON.stringify(items,null,2)],{type:'application/json'}));let a=el('a');a.href=url;a.download='bitacora-'+new Date().toISOString().slice(0,10)+'.json';a.click();globalThis.URL.revokeObjectURL(url)};
async function session(s){user=s?.user||null;$('login').hidden=!!user;$('app').hidden=!user;$('logout').hidden=!user;if(user){try{await load()}catch(e){fail(e)}}else{items=[];$('cards').replaceChildren();$('editor').hidden=true;epoch++}}
if(!KEY.startsWith('sb_publishable_')){msg('Instalación pendiente: configura Supabase según la guía.');$('loginForm').querySelector('button').disabled=true}else{db=createClient(URL,KEY);$('loginForm').onsubmit=async e=>{e.preventDefault();msg('');let {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(error)fail(error);else await session(data.session)};$('logout').onclick=async()=>{let {error}=await db.auth.signOut();if(error)fail(error);else await session(null)};let {data}=await db.auth.getSession();await session(data.session);db.auth.onAuthStateChange((event,s)=>{if(event==='SIGNED_OUT')session(null)})}
</script></html>
